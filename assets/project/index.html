<!doctype html>
<!-- The studio page: the router for every scene. Open it straight from disk to scrub (space plays, ←/→ step a
     frame, shift for a second). tools/render.mjs drives the same page headless. To add a scene: a file in
     src/scenes/ plus a script tag below, in timeline order. -->
<html>
<head>
<meta charset="utf-8">
<title>studio</title>
<style>
  html, body { margin: 0; background: #151515; color: #ddd; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); height: auto; background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  button, select { font: inherit; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 3px 8px; }
  body.raw main { padding: 0; } body.raw .bar { display: none; } body.raw #out { width: auto; }
</style>
</head>
<body>
<main>
  <canvas id="out"></canvas>
  <div class="bar">
    <button id="play" title="space">▶</button>
    <input id="scrub" type="range">
    <select id="scene"></select>
    <label><input id="marks" type="checkbox"> marks</label>
  </div>
  <div class="bar"><span id="time">loading…</span></div>
</main>
<script src="src/config.js"></script>
<script src="src/kit.js"></script>
<script src="data/timing.js"></script>
<script src="src/studio.js"></script>
<script src="src/cast/walker.js"></script>
<script src="src/scenes/01-walk.js"></script>
<script src="src/scenes/02-title.js"></script>
<script>studio.start();</script>
</body>
</html>
